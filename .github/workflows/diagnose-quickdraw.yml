name: Diagnose QuickDraw model

on:
  push:
    paths:
      - .github/workflows/diagnose-quickdraw.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TensorFlow
        run: pip install --quiet tensorflow-cpu==2.20.0
      - name: Download model and canonical Quick Draw samples
        run: |
          curl --fail --location --retry 3 \
            https://huggingface.co/zarqankhn/quickdraw-345-tflite/resolve/b02fde8d8732aed32bc9d8176c3dc4efda0333fb/quickdraw_model.tflite \
            -o /tmp/model.tflite
          curl --fail --location https://huggingface.co/zarqankhn/quickdraw-345-tflite/raw/main/labels.txt -o /tmp/labels.txt
          curl --fail --location https://huggingface.co/zarqankhn/quickdraw-345-tflite/raw/main/categories.txt -o /tmp/categories.txt
          for name in fish horse crab; do
            curl --fail --location "https://storage.googleapis.com/quickdraw_dataset/full/numpy_bitmap/${name}.npy" -o "/tmp/${name}.npy"
          done
      - name: Compare polarity and label ordering
        run: |
          python - <<'PY'
          import numpy as np
          import tensorflow as tf

          labels = open('/tmp/labels.txt', encoding='utf-8').read().splitlines()
          categories = open('/tmp/categories.txt', encoding='utf-8').read().splitlines()
          interpreter = tf.lite.Interpreter(model_path='/tmp/model.tflite')
          interpreter.allocate_tensors()
          inp = interpreter.get_input_details()[0]
          out = interpreter.get_output_details()[0]

          print('input', inp['shape'], inp['dtype'], 'output', out['shape'], out['dtype'])
          print('labels==categories?', labels == categories)

          for expected in ('fish', 'horse', 'crab'):
            bitmap = np.load(f'/tmp/{expected}.npy')[0].astype(np.float32).reshape(1, 28, 28, 1) / 255.0
            for polarity, image in [('raw-black-bg-white-stroke', bitmap), ('inverted-white-bg-black-stroke', 1.0 - bitmap)]:
              interpreter.set_tensor(inp['index'], image)
              interpreter.invoke()
              probs = interpreter.get_tensor(out['index'])[0]
              indices = np.argsort(probs)[::-1][:5]
              by_labels = [(labels[i], float(probs[i])) for i in indices]
              by_categories = [(categories[i], float(probs[i])) for i in indices]
              print('\nEXPECTED', expected, 'POLARITY', polarity, 'sum', float(probs.sum()), 'max', float(probs.max()))
              print('labels    ', by_labels)
              print('categories', by_categories)
          PY
