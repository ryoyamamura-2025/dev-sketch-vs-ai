name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_QUICKDRAW_MODEL_URL: ${{ vars.VITE_QUICKDRAW_MODEL_URL || secrets.VITE_QUICKDRAW_MODEL_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Stage AI runtime assets
        run: |
          mkdir -p public/models public/litert-wasm
          cp -R node_modules/@litertjs/core/wasm/. public/litert-wasm/
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://huggingface.co/zarqankhn/quickdraw-345-tflite/resolve/b02fde8d8732aed32bc9d8176c3dc4efda0333fb/quickdraw_model.tflite" \
            --output public/models/quickdraw_model.tflite
          test "$(wc -c < public/models/quickdraw_model.tflite)" -gt 8000000
      - run: npm test
      - name: Validate runtime configuration
        run: |
          test -n "$VITE_SUPABASE_URL" || (echo "::error::VITE_SUPABASE_URL is not configured" && exit 1)
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || (echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY is not configured" && exit 1)
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
